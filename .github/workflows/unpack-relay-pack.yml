
name: Unpack Relay Animator Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP="Fazbear_Relay_Animator_GitHub_Pack-1.zip"
          if [ ! -f "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -iname 'Fazbear_Relay_Animator_GitHub_Pack*.zip' -print -quit)"
          fi
          test -n "$ZIP"
          mkdir -p /tmp/relay-pack
          unzip -o "$ZIP" -d /tmp/relay-pack
          test -d /tmp/relay-pack/FazbearRelayAnimator
          test -d /tmp/relay-pack/StageESP32
          cp -a /tmp/relay-pack/FazbearRelayAnimator .
          cp -a /tmp/relay-pack/StageESP32 .
          cp -f /tmp/relay-pack/README.md README.md
          git add FazbearRelayAnimator StageESP32 README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Extract relay animator project source"
            git push
          fi
